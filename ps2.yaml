project: freetype

targets:
  - name: freetype
    type: ee_lib
    sources:
      - src/autofit/autofit.c
      - src/base/ftbase.c
      - src/base/ftbbox.c
      - src/base/ftbdf.c
      - src/base/ftbitmap.c
      - src/base/ftcid.c
      - src/base/ftfstype.c
      - src/base/ftgasp.c
      - src/base/ftglyph.c
      - src/base/ftgxval.c
      - src/base/ftinit.c
      - src/base/ftmm.c
      - src/base/ftotval.c
      - src/base/ftpatent.c
      - src/base/ftpfr.c
      - src/base/ftstroke.c
      - src/base/ftsynth.c
      - src/base/fttype1.c
      - src/base/ftwinfnt.c
      - src/bdf/bdf.c
      - src/bzip2/ftbzip2.c
      - src/cache/ftcache.c
      - src/cff/cff.c
      - src/cid/type1cid.c
      - src/gzip/ftgzip.c
      - src/lzw/ftlzw.c
      - src/pcf/pcf.c
      - src/pfr/pfr.c
      - src/psaux/psaux.c
      - src/pshinter/pshinter.c
      - src/psnames/psnames.c
      - src/raster/raster.c
      - src/sdf/sdf.c
      - src/sfnt/sfnt.c
      - src/smooth/smooth.c
      - src/svg/svg.c
      - src/truetype/truetype.c
      - src/type1/type1.c
      - src/type42/type42.c
      - src/winfonts/winfnt.c
      # Neither WIN32 nor UNIX per upstream CMakeLists's own dispatch -
      # falls to its generic, portable else() branch:
      - src/base/ftsystem.c
      - src/base/ftdebug.c
      # FT_CONFIG_OPTION_USE_ZLIB is on by default but
      # FT_CONFIG_OPTION_SYSTEM_ZLIB is off - ftgzip.c uses FreeType's
      # OWN vendored minimal inflate (src/gzip/) rather than linking a
      # system libz, matching upstream's own untouched default. No
      # dependency on the z package needed as a result.
      # FT_CONFIG_OPTION_USE_BZIP2 is off by default - ftbzip2.c compiles
      # to stub/no-op form, matching upstream's own default (no real
      # bzip2 library needed).
    include_dirs:
      - include
    defines:
      - FT2_BUILD_LIBRARY
